name: Issue Monitor — Plan d'action automatique

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { issue, octokit, github } = context;
            const title = issue.title;
            const body = issue.body || '';
            const number = issue.number;
            const author = issue.user.login;

            // 🔒 Sécurité : ne répondre qu'aux issues créées par le proprio ou les collaborateurs
            const owner = context.repo.owner;
            const isOwner = author === owner;

            let isCollaborator = false;
            if (!isOwner) {
              try {
                await octokit.rest.repos.checkCollaborator({
                  owner,
                  repo: context.repo.repo,
                  username: author,
                });
                isCollaborator = true;
              } catch {
                // pas collaborateur → on skip
                console.log(`Issue #${number} by @${author} — skipped (not a collaborator)`);
                return;
              }
            }

            console.log(`Issue #${number} by @${author} — generating plan...`);

            const lcTitle = title.toLowerCase();
            const lcBody = body.toLowerCase();

            let plan = '';

            if (lcTitle.includes('padding') || lcBody.includes('padding')) {
              plan = [
                `## Plan d'action pour #${number} — ${title}`,
                '',
                '### Analyse',
                'Le padding des boutons est insuffisant, ce qui les rend trop étroits.',
                '',
                '### Actions',
                '1. Modifier `src/components/ui/Bouton.tsx` — ajouter `py-[10px]` et augmenter `px-*`',
                '2. Vérifier avec `pnpm typecheck`',
                '3. Commiter et pusher sur une branche `fix/us-b01-padding`',
                '',
                '### Composants concernés',
                '- `Bouton.tsx`',
              ].join('\n');
            } else if (lcTitle.includes('font') || lcBody.includes('csp') || lcBody.includes('content security')) {
              plan = [
                `## Plan d'action pour #${number} — ${title}`,
                '',
                '### Analyse',
                'Les polices embarquées en base64 dans `style.css` sont bloquées par la CSP',
                '(`font-src \\'self\\'` sans `data:`).',
                '',
                '### Actions',
                "1. Ajouter `data:` à la directive `font-src` dans la CSP",
                '2. Ou extraire les polices en fichiers WOFF2 servis statiquement',
                '3. Vérifier avec `pnpm typecheck`',
                '4. Commiter et pusher sur une branche `fix/us-b02-font-csp`',
                '',
                '### Fichiers concernés',
                '- Configuration CSP du serveur (Storybook, Vite, ou déploiement)',
                '- `style.css` (polices embarquées)',
              ].join('\n');
            } else {
              plan = [
                `## Plan d'action pour #${number} — ${title}`,
                '',
                '### Analyse',
                'Issue à analyser plus en détail.',
                '',
                '### Actions à déterminer',
                '1. Lire le code concerné',
                '2. Comprendre le problème',
                '3. Proposer une correction',
              ].join('\n');
            }

            plan += '\n\n---\n🤖 *Plan d\'action généré automatiquement par Hermes Agent*';

            await octokit.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: plan,
            });
